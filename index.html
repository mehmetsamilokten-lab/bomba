.st-main{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:28px 0 10px}
.st-hero{text-align:left}.st-trio{display:block;width:min(100%,560px);height:auto;margin:0 0 4px -10px;filter:drop-shadow(0 18px 24px #0008)}
.st-title{margin:0;line-height:.92;font-family:Bungee,sans-serif;font-weight:400}.st-title .t1{display:block;font-size:clamp(40px,6.4vw,76px);color:#fff;text-shadow:0 4px 0 #0b1330}
.st-title .t2{display:inline-block;margin-top:8px;font-size:clamp(34px,5.2vw,62px);color:#1b1206;background:#ffcc00;padding:2px 18px 0;border-radius:10px;transform:rotate(-2.5deg);box-shadow:0 6px 0 #c77a12}
.st-tag{margin:22px 0 16px;font-size:18px;color:#b9c3ea;max-width:30em}
.st-pills{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}.st-pills li{font:600 13px Rubik,sans-serif;color:#d6dcf7;border:1px solid #ffffff26;border-radius:999px;padding:6px 12px}
.st-panel{background:#141e46ee;border:1px solid #ffffff1f;border-radius:20px;padding:24px;box-shadow:0 30px 60px -20px #000c,inset 0 1px 0 #ffffff14}
.st-panel h2,.st-how h2{margin:0 0 16px;font:600 22px Rubik,sans-serif;color:#fff}
.st-f{margin-bottom:18px}.st-f label,.st-lab{display:block;margin:0 0 8px;font:600 13px Rubik,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8f9ccc}
.st-roomrow{display:flex;gap:8px}.st-roomrow input{flex:1;min-width:0;width:auto;font:600 22px/1 Rubik,sans-serif;letter-spacing:.04em;padding:12px 14px;border-radius:12px;border:1px solid #ffffff2e;background:#0a1130;color:#fff}
.st-roomrow input:focus{outline:none;border-color:#ffcc00;box-shadow:0 0 0 3px #ffcc0033}
.st-ib{display:inline-flex;align-items:center;gap:6px;padding:0 14px;font:600 14px Rubik,sans-serif;border-radius:12px;background:#ffffff12;color:#e5e9ff;border:1px solid #ffffff1f}.st-ib:hover{background:#ffffff22}
.st-help{margin:6px 0 0;font-size:13px;color:#7f8bb8}
.st-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st-role{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 8px 12px;border-radius:14px;background:#0c1538;border:1px solid #ffffff1c;color:#fff;line-height:1.25;transition:transform .12s,border-color .12s}
.st-role img{width:72px;height:72px;border-radius:50%;background:radial-gradient(#2a3b7a,#16214f);object-fit:cover;margin-bottom:4px}
.st-role b{font-size:16px}.st-role em{font:400 11px Bungee,sans-serif;font-style:normal;color:#ffcc00;letter-spacing:.04em}.st-role small{font-size:12px;color:#8f9ccc;margin-top:2px}
.st-role:hover{transform:translateY(-2px);border-color:#ffffff40}.st-role[aria-pressed=true]{color:#fff;border-color:#ffcc00;background:#1d2858;box-shadow:0 0 0 2px #ffcc00 inset}
.st-role[aria-pressed=true]::after{content:'✓';position:absolute;top:8px;right:9px;width:20px;height:20px;border-radius:50%;background:#ffcc00;color:#1b1206;font:700 13px/20px Rubik,sans-serif}
.st-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#0a1130;border:1px solid #ffffff1c;border-radius:12px}
.st-seg button{display:flex;flex-direction:column;align-items:center;min-height:0;padding:8px 4px;border-radius:9px;background:transparent;color:#c9d1f2;line-height:1.2}
.st-seg button b{font-size:15px}.st-seg button small{font-size:11px;color:#7f8bb8}.st-seg button[aria-pressed=true]{background:#2a3874;color:#fff}.st-seg button[aria-pressed=true] small{color:#c9d1f2}
.st-go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:6px 0 0;min-height:56px;font:400 20px Bungee,sans-serif;color:#1b1206;background:#ffcc00;border-radius:14px;box-shadow:0 5px 0 #c77a12;transition:transform .08s,box-shadow .08s}
.st-go:hover{background:#ffd633}.st-go:active{transform:translateY(4px);box-shadow:0 1px 0 #c77a12}.st-go svg{width:22px;height:22px}
.st-err{min-height:20px;margin:10px 0 0;font-size:14px;color:#ffb3a8;text-align:center}
.st-how{margin:34px 0 0;padding:26px 0 0;border-top:1px solid #ffffff14}.st-how ol{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0;padding:0}
.st-how li{counter-increment:s;display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff12}
.st-how li::before{content:counter(s,decimal-leading-zero);font:400 15px Bungee,sans-serif;color:#ff8a3d}.st-how li b{color:#fff}.st-how li span{font-size:14px;color:#9aa6d4}
.st-foot{display:flex;justify-content:center;align-items:baseline;gap:14px;padding:24px 0 28px;color:#6f7aa6;font-size:13px}.st-foot .priv{margin:0;color:#6f7aa6}.st-foot .priv summary{padding:0;text-decoration:underline;text-underline-offset:3px}.st-foot .priv p{color:#9aa6d4}
@media (max-width:860px){.st-main{grid-template-columns:1fr;gap:20px;padding-top:16px}.st-hero{text-align:center}.st-trio{margin:0 auto;width:min(100%,440px)}.st-pills{justify-content:center}.st-tag{margin-inline:auto}.st-how ol{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.st-roomrow{flex-wrap:wrap}.st-roomrow input{flex-basis:100%}.st-ib{flex:1;justify-content:center;min-height:44px}.st-ib span{display:inline}.st-link span,.st-chip span{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st-how ol{grid-template-columns:1fr}.st-panel{padding:18px}.st-role small{display:none}}
.st-role[aria-pressed=true] small{color:#8f9ccc}.st-go{animation:none}body:has(.st-bg){background:#080d22}
@media (prefers-reduced-motion:reduce){.st-role,.st-go{transition:none}}
.pf-main{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start;padding:24px 0 32px}
.pf-stage{position:relative;border-radius:24px;overflow:hidden;background:radial-gradient(60% 55% at 50% 38%,#3a57b8 0%,#1b2a66 55%,#0e173e 100%);border:1px solid #ffffff1f;box-shadow:inset 0 -60px 80px #0006}
.pf-stage::before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 30%,#ffffff08 0 8deg,transparent 8deg 20deg);pointer-events:none}
.pf-3d{position:relative;height:min(62vh,520px);min-height:340px}.pf-3d canvas{display:block;width:100%!important;height:100%!important;cursor:grab}.pf-3d canvas:active{cursor:grabbing}
.pf-fb{display:grid;place-items:center;height:100%}.pf-fb .mk{width:220px;height:220px}
.pf-plate{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.pf-plate b{font:400 24px Bungee,sans-serif;color:#fff;background:#0b1330cc;border:2px solid #ffcc00;padding:4px 18px;border-radius:12px;white-space:nowrap}
.pf-sec{font:700 13px Rubik,sans-serif;color:#1b1206;background:#ffcc00;padding:4px 12px;border-radius:999px;box-shadow:0 3px 0 #c77a12}.pf-sec.pop{animation:pfpop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pfpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.pf-tip{position:absolute;left:0;right:0;bottom:10px;margin:0;text-align:center;font-size:12px;color:#9fb0e6;pointer-events:none}
.pf-grid{display:flex;flex-wrap:wrap;gap:6px}.pf-chip{min-height:38px;padding:6px 12px;font:600 14px Rubik,sans-serif;border-radius:10px;background:#0c1538;color:#dfe5ff;border:1px solid #ffffff1c}
.pf-chip[aria-pressed=true]{background:#ffcc00;color:#1b1206;border-color:#ffcc00}
.pf-sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.pf-sw .sw2{width:auto;height:auto;aspect-ratio:1;min-height:0;border-radius:50%;border:2px solid #ffffff33;padding:0}
.pf-sw .sw2[aria-pressed=true]{outline:3px solid #ffcc00;outline-offset:2px;border-color:#fff}
@media (max-width:860px){.pf-main{grid-template-columns:1fr}.pf-3d{height:46vh;min-height:300px}}
.pftag{position:absolute;z-index:6;pointer-events:none;display:flex;flex-direction:column;gap:1px;max-width:240px;padding:8px 12px;border-radius:10px;background:#0b1330ee;border:1px solid #ffffff2a;color:#fff;font:14px/1.25 Rubik,sans-serif;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;box-shadow:0 8px 20px #0007}.pftag.on{opacity:1;transform:none}
.pftag small,.pfcard small{font:600 11px Rubik,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ffcc00}.pftag b,.pfcard b{font-weight:600}.pftag em,.pfcard em{font-style:normal;font-size:12px;color:#9fb0e6}
.pfcard{position:absolute;left:50%;bottom:16px;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:200px;padding:10px 20px;border-radius:14px;background:#0b1330f2;border:1px solid #ffcc0088;color:#fff;font:17px/1.2 Rubik,sans-serif;text-align:center;opacity:0;transform:translate(-50%,10px);transition:opacity .18s,transform .18s;box-shadow:0 10px 30px #0008}.pfcard.on{opacity:1;transform:translate(-50%,0)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}.fcs{min-height:40px;padding:6px 14px;font:600 14px Rubik,sans-serif;border-radius:999px;background:#2e2a22;color:#f2ead8;border:1px solid #ffffff22}.fcs[aria-pressed=true]{background:var(--y);color:#111}.fback{background:#3a2418;margin-left:auto}
.fact[hidden]{display:none!important}.fact{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 0;padding:10px 12px;border-radius:12px;background:#221d16;border:1px solid #ffcc0055;font-size:14px;color:#e9e0cc}.fact button,.fadd{min-height:38px;padding:6px 12px;font:600 14px Rubik,sans-serif;border-radius:10px;background:#3a3428;color:#fff;border:0;cursor:pointer;display:inline-flex;align-items:center}.fshoot{background:var(--y)!important;color:#111!important}.fsmall{flex-basis:100%;font-size:12px;color:#a99f88}

.fact[hidden]{display:none!important}.fact{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 0;padding:10px 12px;border-radius:12px;background:#221d16;border:1px solid #ffcc0055;font-size:14px;color:#e9e0cc}.fact button,.fadd{min-height:38px;padding:6px 12px;font:600 14px Rubik,sans-serif;border-radius:10px;background:#3a3428;color:#fff;border:0;cursor:pointer;display:inline-flex;align-items:center}.fshoot{background:var(--y)!important;color:#111!important}.fsmall{flex-basis:100%;font-size:12px;color:#a99f88}
.wrap.dz{max-width:1480px}.dzg{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:18px;align-items:start}.dzl{min-width:0}.dzr{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;min-width:0}.dzr .wl{margin-top:0}
@media (max-width:760px){.dzg{grid-template-columns:1fr}.dzr{position:static;max-height:none}}
.en-bg.w{background:radial-gradient(900px 500px at 50% 0%,#2fbf6a44,transparent 60%),radial-gradient(800px 500px at 50% 110%,#ffcc0022,transparent 60%),linear-gradient(#0f1a3f,#080d22)}
.en-bg.l{background:radial-gradient(900px 520px at 50% 20%,#ff5a1f55,transparent 60%),radial-gradient(700px 400px at 50% 110%,#7a101099,transparent 70%),linear-gradient(#2a0e0e,#0d0606)}
.en-flash{position:fixed;inset:0;z-index:20;pointer-events:none;background:#fff;animation:enfl .9s ease-out forwards}@keyframes enfl{0%{opacity:1}100%{opacity:0}}
.en .st-top{border-color:#ffffff1a}.en-meta{font:600 13px Rubik,sans-serif;color:#9aa6d4}.en.l .en-meta{color:#d8a59a}
.en-main{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 0 40px}
.en-trio{width:min(100%,420px);height:auto;filter:drop-shadow(0 16px 20px #0009)}.en.l .en-trio{filter:grayscale(.7) brightness(.55) sepia(.4) drop-shadow(0 16px 20px #000);animation:enshk .5s 2}
@keyframes enshk{0%,100%{transform:none}25%{transform:translate(-6px,3px) rotate(-1deg)}75%{transform:translate(6px,-3px) rotate(1deg)}}
.en-tag{margin-top:6px;font:700 12px Rubik,sans-serif;letter-spacing:.2em;color:#9aa6d4}.en.w .en-tag{color:#7be3a2}.en.l .en-tag{color:#ff9a7a}
.en-h{margin:4px 0 0;font:400 clamp(54px,11vw,118px)/.95 Bungee,sans-serif;letter-spacing:.01em;animation:enpop .6s cubic-bezier(.2,1.6,.4,1)}
.en.w .en-h{color:#fff;text-shadow:0 6px 0 #1d7a43,0 0 40px #2fbf6a88}.en.l .en-h{color:#ffcc00;text-shadow:0 6px 0 #a5300f,0 0 60px #ff5a1f}
@keyframes enpop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.en-sub{margin:14px 0 22px;font-size:18px;color:#c9d1f2}.en.l .en-sub{color:#f2cfc5}
.en-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:min(100%,720px);margin-bottom:26px}
.en-st{display:flex;flex-direction:column;gap:2px;padding:14px 10px;border-radius:14px;background:#ffffff0c;border:1px solid #ffffff1c}.en-st b{font:400 26px Bungee,sans-serif;color:#fff}.en-st span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9aa6d4}.en.l .en-st span{color:#d8a59a}
.en-act{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(100%,560px)}.en-act .en-go{flex:1.3;margin:0;width:auto}.en-sec{flex:1;min-height:56px;font:600 17px Rubik,sans-serif;border-radius:14px;background:#ffffff14;color:#fff;border:1px solid #ffffff2a}
.en-wait{display:flex;align-items:center;gap:10px;color:#c9d1f2}.en-dot{width:10px;height:10px;border-radius:50%;background:#ffcc00;animation:pulse 1.2s infinite}

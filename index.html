<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Üç Maymun Bomba</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* VOICE: gergin, eğlenceli parti oyunu
IDEA: tezgâhtaki bomba kasası
PICTURE: bombanın kendisi
COLOUR/TYPE: kömür zemin, haki kasa, uyarı sarısı, kırmızı LED; Bungee + Rubik
LAYOUT: kurulum kartı, sonra tam genişlik bomba */
:root{color-scheme:dark;--bg:#16130f;--ink:#f3eee2;--y:#ffcc00;--r:#ff3b30;--mut:#a9a28e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1{font:400 clamp(28px,6vw,44px)/1.05 Bungee,sans-serif;margin:0 0 8px;color:var(--y)}
.wrap{max-width:900px;margin:auto;padding:20px 16px}
.card{background:#211d17;border-radius:16px;padding:20px}
label{display:block;margin:14px 0 6px;font-weight:600}
input{font:inherit;font-size:20px;padding:10px 14px;border-radius:10px;border:2px solid #444;background:#0e0c0a;color:var(--ink);width:9em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
button{font:600 17px Rubik,sans-serif;min-height:48px;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:#2e2a22;color:var(--ink)}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.role{text-align:start;line-height:1.3}.role small{display:block;font-weight:400;color:var(--mut)}
.role[aria-pressed=true]{background:var(--y);color:#111}.role[aria-pressed=true] small{color:#333}
.go{background:var(--r);color:#fff;margin-top:18px;width:100%;font-size:20px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.timer{font:400 30px Bungee,sans-serif;color:var(--r);background:#000;padding:4px 14px;border-radius:8px;white-space:nowrap}
.bomb{background:linear-gradient(#6a6946,#4a4930);border-radius:22px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:14px;box-shadow:0 10px 0 #2b2a1b,0 20px 40px #0008;transition:box-shadow .2s}
.mod{background:#2a2a20;border-radius:12px;padding:14px;min-height:200px;position:relative}
.mod h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.led{position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;background:#500}
.wires{display:flex;justify-content:space-around;height:150px}
.wire{width:34px;border-radius:8px;padding:0;min-height:0;border:2px solid #0006}
.wire.cut{opacity:.25}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.key{height:66px;font-size:34px;background:#d9d2bd;color:#111}
.key.on{box-shadow:inset 0 0 0 4px #3f3}
.big{width:130px;height:130px;border-radius:50%;margin:6px auto;display:block;font-size:18px;color:#fff;box-shadow:0 6px 0 #0006;text-shadow:0 1px 2px #000}
.see .bomb button{pointer-events:none}
.blind .bomb{background:#0b0b0b;box-shadow:none}.blind .mod{background:#111}.blind h3{color:#1c1c1c}
.blind .wire{background:#3a3a3a!important;border-color:#222}.blind .key{background:#2a2a2a;color:transparent}
.blind .big{background:#333!important;color:transparent;text-shadow:none}.blind .led{background:#181818}
.blind.okf .bomb{box-shadow:0 0 0 8px #1f6b1f}.blind.badf .bomb{box-shadow:0 0 0 8px #7a1010}
.manual{background:#f4efe1;color:#1d1a14;border-radius:12px;padding:20px}
.manual h2{font:400 20px Bungee,sans-serif;margin:18px 0 6px}.manual h2:first-child{margin-top:0}
.manual ol{margin:0;padding-inline-start:1.6em}.manual li{margin:2px 0}
.manual table{border-collapse:collapse}.manual td{padding:4px 14px 4px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-inline-end:6px;border:1px solid #0005}
.end{font:400 clamp(30px,8vw,56px)/1.1 Bungee,sans-serif;text-align:center;margin:30px 0 10px}
.hint{color:var(--mut);font-size:14px;margin:10px 0}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.bubble{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--y);color:#111;font:400 clamp(28px,7vw,48px) Bungee,sans-serif;padding:10px 26px;border-radius:18px;box-shadow:0 8px 30px #000a;z-index:9;display:none}
.gest{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:12px}
.gest button{background:var(--y);color:#111;font-size:18px}
.st{display:grid;gap:6px;margin:14px 0}.st span{padding:10px 14px;border-radius:10px;background:#2e2a22}.st .on{background:#1f5a2a}
.mod.ok .led{background:#3f3}.blind .mod.ok .led{background:#181818}
.mk{width:44px;height:44px;vertical-align:middle;margin-inline-end:6px}
.wire{position:relative;transition:opacity .3s}
.wire.cut::after{content:'';position:absolute;left:-8px;right:-8px;top:46%;height:12%;background:#2a2a20;box-shadow:0 0 12px 4px #ffcc00aa}
.blind .wire.cut::after{background:#111;box-shadow:none}
.key,.big{transition:transform .08s}.key:active,.big:active{transform:scale(.93)}
.bubble{align-items:center;gap:10px}.bubble .mk{width:64px;height:64px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.fx.boom{background:radial-gradient(circle,#fff 0,#ffcc00 20%,#ff3b30 45%,transparent 70%);animation:flash 1.6s forwards}
@keyframes flash{0%{opacity:1;transform:scale(.2)}30%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(2)}}
.fx.win i{position:absolute;top:-10%;font-style:normal;font-size:36px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
@media (prefers-reduced-motion:no-preference){
.mk{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
.wire.cut::after{animation:snap .4s ease-out}@keyframes snap{from{transform:scaleX(2);box-shadow:0 0 30px 12px #ffcc00}}
.mod.ok .led{animation:pop .5s}@keyframes pop{50%{transform:scale(2.2)}}
.bomb.hot{animation:tremble .15s infinite}@keyframes tremble{25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.timer{animation:glow 1s infinite}@keyframes glow{50%{box-shadow:0 0 18px #ff3b3099}}
.bubble.pop{animation:bpop .4s cubic-bezier(.3,1.6,.5,1)}@keyframes bpop{from{transform:translateX(-50%) scale(.3)}}
.end{animation:zoom .6s cubic-bezier(.3,1.6,.5,1)}@keyframes zoom{from{transform:scale(.2);opacity:0}}}
#v3{height:min(70vh,560px);min-height:340px;border-radius:18px;overflow:hidden;transition:box-shadow .2s}#v3 canvas{display:block;touch-action:none}
.blind.okf #v3{box-shadow:0 0 0 8px #1f6b1f}.blind.badf #v3{box-shadow:0 0 0 8px #7a1010}
.team{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.team span{padding:6px 12px;border-radius:30px;background:#2e2a22;transition:box-shadow .15s}.team span.talk{box-shadow:0 0 0 3px var(--y)}
@media (prefers-reduced-motion:no-preference){.team span.talk .mk{animation:talk .25s infinite alternate}@keyframes talk{to{transform:scale(1.15)}}}
.pad{position:relative;height:120px;border-radius:14px;background:#2e2a22;margin:10px 0;touch-action:none;display:grid;place-items:center;color:var(--mut);font-size:14px;text-align:center;padding:0 60px;user-select:none}
.pad::after{content:'';position:absolute;left:var(--px,50%);top:var(--py,50%);width:34px;height:34px;margin:-17px;border-radius:50%;background:var(--y);pointer-events:none}
.manual{min-height:380px;border-left:12px solid #7a2e1f;box-shadow:inset 14px 0 18px -14px #0006,0 6px 0 #c9bf9f;touch-action:pan-y}
.pg{display:none}.pg.on{display:block}.cover{text-align:center}.cover h2{font-size:30px;margin-top:20px}
.toc{display:grid;gap:8px;max-width:340px;margin:16px auto}.toc button{background:#e2dac2;color:#1d1a14}
.pgno{text-align:end;color:#8a8270;font-size:13px;margin-top:16px}
.bnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.pg.on{animation:flip .35s ease-out;transform-origin:left center}@keyframes flip{from{transform:perspective(900px) rotateY(-35deg);opacity:0}}}
.need{background:#ece4cc;padding:8px 12px;border-radius:8px}
.manual table{border-collapse:collapse;margin:8px 0}.manual th,.manual td{padding:5px 10px 5px 0;text-align:start;border-bottom:1px solid #d8cfb4;white-space:nowrap}
.g3{display:grid;grid-template-columns:repeat(3,12px);gap:2px}.g3 i{width:12px;height:12px;background:#2a261e;border-radius:2px}.g3 i.y{background:#e6b800}
.manual{overflow-x:auto}.mzs{display:flex;flex-wrap:wrap;gap:10px}.mzs figure{margin:0;text-align:center}
.bch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.bch span{display:grid;justify-items:center;gap:2px;background:#f4efe1;color:#111;border-radius:6px;padding:4px 7px}.bd{margin:8px 0;color:var(--mut)}.bd summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><div class="bubble" id="bub"></div><div class="wrap" id="app"></div>
<script>{
const COL={kırmızı:'#e53935',mavi:'#1e63ff',sarı:'#fdd835',yeşil:'#2fa84f',beyaz:'#f2f2f2',siyah:'#151515'};
const C4=['kırmızı','mavi','yeşil','sarı'],NAMES=['Kablo','Renk Kaydırıcı','Yön','Hesap Makinesi','Sembol','Piyano','Ses Paneli','Şalter','Labirent','Mors','Maymun Der'];
const DIRS=['↑','→','↓','←'],DN=['Yukarı','Sağ','Aşağı','Sol'],NOTES=['C','D','E','F','G','A','B'],NOTEF=[262,294,330,349,392,440,494];
const SYM=[['★','dolu yıldız'],['☆','boş yıldız'],['▲','üçgen'],['▼','ters üçgen'],['⧗','kum saati'],['◉','halka'],['⊕','artılı daire'],['Φ','fi'],['◆','elmas'],['☾','hilal']];
const BR=[[2,4,5],[1],[1,2],[1,4],[1,4,5],[1,5],[1,2,4],[1,2,4,5],[1,2,5],[2,4]];
const brlSVG=d=>`<svg viewBox="0 0 24 34" width="20" height="28">${[1,2,3,4,5,6].map(k=>`<circle cx="${k>3?17:7}" cy="${7+((k-1)%3)*10}" r="3.6" fill="${BR[d].includes(k)?'#111':'none'}" stroke="#111" stroke-width="1"/>`).join('')}</svg>`;
const BCH=`<div class="bch">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<span>${brlSVG(d)}<b>${d}</b></span>`).join('')}</div>`;
const MORSE=['-----','.----','..---','...--','....-','.....','-....','--...','---..','----.'];
const RULES=['Braille sayısı tekse YUKARI','Braille sayısı 1, 2, 6 veya 9 ise YUKARI',"Braille sayısı 5'ten büyükse YUKARI",'Braille sayısı kırmızı lambanın altındakinden büyükse YUKARI'];
const ROLES=[['kor','Kör Maymun','Bombaya dokunur ama göremez'],['sagir','Sağır Maymun','Bombayı görür ama duyamaz'],['dilsiz','Dilsiz Maymun','Kılavuzu okur ama konuşamaz']];
const ORDER=ROLES.map(r=>r[0]),RN=Object.fromEntries(ROLES.map(r=>[r[0],r[1]]));
const G=['👍 Evet','👎 Hayır','✋ Dur','⏳ Bekle','❓ Tekrar','1','2','3','4','5','6'];
const MK=r=>`<svg class="mk" viewBox="0 0 100 100" aria-hidden="true"><circle cx="18" cy="50" r="14" fill="#8a5a33"/><circle cx="82" cy="50" r="14" fill="#8a5a33"/><circle cx="18" cy="50" r="7" fill="#e8c39e"/><circle cx="82" cy="50" r="7" fill="#e8c39e"/><circle cx="50" cy="50" r="34" fill="#8a5a33"/><ellipse cx="50" cy="60" rx="24" ry="20" fill="#e8c39e"/><ellipse cx="40" cy="44" rx="10" ry="11" fill="#e8c39e"/><ellipse cx="60" cy="44" rx="10" ry="11" fill="#e8c39e"/>`+(r==='kor'?`<rect x="20" y="36" width="60" height="14" rx="5" fill="#222"/>`:`<circle cx="41" cy="45" r="4" fill="#222"/><circle cx="59" cy="45" r="4" fill="#222"/>`)+`<ellipse cx="50" cy="60" rx="4" ry="2.5" fill="#5a3a20"/>`+(r==='dilsiz'?`<rect x="35" y="66" width="30" height="9" rx="2" fill="#ddd" transform="rotate(-10 50 70)"/><rect x="35" y="66" width="30" height="9" rx="2" fill="#bbb" transform="rotate(10 50 70)"/>`:`<path d="M40 70 Q50 77 60 70" stroke="#5a3a20" stroke-width="3" fill="none"/>`)+(r==='sagir'?`<path d="M16 34 Q50 -4 84 34" stroke="#d33" stroke-width="7" fill="none"/><circle cx="18" cy="50" r="15" fill="#d33"/><circle cx="82" cy="50" r="15" fill="#d33"/>`:'')+`</svg>`;
function fx(win){const d=document.createElement('div');d.className='fx '+(win?'win':'boom');if(win)d.innerHTML=Array.from({length:26},()=>`<i style="left:${Math.random()*100}%;animation-delay:${(Math.random()*1.5).toFixed(2)}s;animation-duration:${(2+Math.random()*2).toFixed(2)}s">🍌</i>`).join('');document.body.appendChild(d);setTimeout(()=>d.remove(),win?5500:1700)}
const app=document.getElementById('app'),bub=document.getElementById('bub');
let st={room:'',round:1,role:null};
try{Object.assign(st,JSON.parse(localStorage.getItem('bomba')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bomba',JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const key=()=>st.room.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
function rng(s){let a=7;for(const c of s)a=Math.imul(a^c.charCodeAt(0),2654435761);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuf=(arr,r)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let ac,timer,cl,peer,stream,micErr=false,phase='setup',b,S;const conns={},auds={};
const pid=r=>'ucmaymun-'+key()+'-'+r,roleOf=id=>id.split('-').pop();
const send=(m,to)=>{for(const r in conns)if((!to||to===r)&&conns[r].open)conns[r].send(m)};
function setup(err=''){
  phase='setup';clearInterval(timer);clearInterval(cl);if(peer){peer.destroy();peer=null}for(const r in conns)delete conns[r];
  if(stream)stream.getTracks().forEach(t=>t.stop());
  app.innerHTML=`<h1>Üç Maymun Bomba</h1><div class="card">
  <p class="hint">Üç kişi de aynı oda kodunu yazar ve farklı bir rol seçer. Oyun içinde sesli konuşma var: Kör Maymun herkesi duyar, Sağır Maymun kimseyi duymaz, Dilsiz Maymun duyar ama konuşamaz, sadece işaret yollar.</p>
  <label for="room">Oda kodu (harf ve rakam)</label><input id="room" value="${esc(st.room)}" placeholder="muz42" autocomplete="off">
  <label>Rolün</label><div class="roles">${ROLES.map(([k,n,d])=>`<button class="role" data-r="${k}" aria-pressed="${st.role===k}">${n}<small>${d}</small></button>`).join('')}</div>
  <button class="go" id="go">Odaya bağlan</button><p class="hint" id="err">${esc(err)}</p></div>`;
  app.querySelectorAll('.role').forEach(x=>x.onclick=()=>{st.role=x.dataset.r;app.querySelectorAll('.role').forEach(y=>y.setAttribute('aria-pressed',y===x))});
  document.getElementById('go').onclick=()=>{st.room=document.getElementById('room').value;
    if(!key()||!st.role){document.getElementById('err').textContent='Oda kodu (harf/rakam) yazıp bir rol seçin.';return}
    save();connect()};
}
const ans={},heads={};let lastG=null;
function talking(r){const a=ans[r];if(!a)return false;const d=new Uint8Array(a.fftSize);a.getByteTimeDomainData(d);let m=0;for(const x of d)m=Math.max(m,Math.abs(x-128));return m>12}
function hear(call){call.on('stream',s=>{const r=roleOf(call.peer);const a=auds[r]||(auds[r]=new Audio());a.srcObject=s;a.muted=st.role==='sagir';a.play().catch(()=>{});try{const an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(s).connect(an);ans[r]=an}catch(e){}})}
function reg(c){const r=roleOf(c.peer);
  c.on('open',()=>{conns[r]=c;if(ORDER.indexOf(st.role)>ORDER.indexOf(r))hear(peer.call(c.peer,stream));if(phase==='lobby')lobby();if(st.role==='kor'&&phase!=='setup')c.send({t:'round',n:st.round,ph:phase,s:S})});
  c.on('data',onData);c.on('close',()=>{if(conns[r]===c)delete conns[r];if(phase==='lobby')lobby()})}
async function connect(){
  app.innerHTML='<p class="hint">Bağlanılıyor…</p>';
  try{ac=ac||new AudioContext();await ac.resume()}catch(e){}
  micErr=false;
  if(st.role==='dilsiz')stream=ac.createMediaStreamDestination().stream;
  else try{app.innerHTML='<p class="hint">Mikrofon izni isteniyor… Tarayıcının sorduğu izne "İzin ver" deyin.</p>';stream=await Promise.race([navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}),new Promise((_,j)=>setTimeout(()=>j(0),8000))])}catch(e){micErr=true;stream=ac.createMediaStreamDestination().stream}
  if(typeof Peer==='undefined'){setup('Bağlantı kütüphanesi yüklenemedi. İnterneti kontrol edin.');return}
  app.innerHTML='<p class="hint">Sunucuya bağlanılıyor…</p>';peer=new Peer(pid(st.role),{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}});const ot=setTimeout(()=>{if(phase==='setup')setup('Bağlantı sunucusuna ulaşılamadı. Linki Chrome veya telefonun tarayıcısında açın (Claude önizlemesinde değil) ve tekrar deneyin.')},12000);
  peer.on('open',()=>{clearTimeout(ot);lobby();const me=ORDER.indexOf(st.role);
    const tick=()=>ORDER.forEach((r,j)=>{if(j<me&&!(conns[r]&&conns[r].open))reg(peer.connect(pid(r),{reliable:true}))});tick();cl=setInterval(tick,3000)});
  peer.on('connection',reg);
  peer.on('call',call=>{call.answer(stream);hear(call)});
  peer.on('error',e=>{if(e.type==='unavailable-id')setup('Bu odada bu rol zaten alınmış. Başka rol seçin.');else if(e.type!=='peer-unavailable'&&phase==='setup')setup('Bağlantı hatası ('+e.type+'). Biraz bekleyip tekrar deneyin.')});
}
function lobby(){
  phase='lobby';clearInterval(timer);
  const all=ORDER.every(r=>r===st.role||(conns[r]&&conns[r].open));
  app.innerHTML=`<div class="bar"><h1 style="margin:0">Oda ${esc(key())}</h1><button id="back">Çık</button></div><div class="card">
  <p><b>Sen: ${RN[st.role]}</b> · Tur ${st.round}</p>
  <div class="st">${ORDER.map(r=>`<span class="${r===st.role||(conns[r]&&conns[r].open)?'on':''}">${MK(r)}${RN[r]}: ${r===st.role?'sen':conns[r]&&conns[r].open?'bağlı':'bekleniyor…'}</span>`).join('')}</div>
  ${micErr?'<p class="hint">Mikrofon izni verilmedi, sesin gitmeyecek. Tarayıcı ayarlarından izin verip yeniden bağlan.</p>':''}
  ${st.role==='kor'?`<label for="rnd">Tur</label><input id="rnd" type="number" min="1" max="99" value="${st.round}" style="width:5em"><button class="go" id="start" ${all?'':'disabled style="opacity:.5"'}>Bombayı başlat</button>${all?'':'<p class="hint">Üç kişi de bağlanınca başlatabilirsin.</p>'}`:'<p class="hint">Herkes bağlanınca Kör Maymun bombayı başlatacak. Konuşmayı şimdiden deneyebilirsiniz.</p>'}</div>`;
  document.getElementById('back').onclick=()=>setup();
  const sb=document.getElementById('start');
  if(sb)sb.onclick=()=>{if(!all)return;st.round=Math.max(1,parseInt(document.getElementById('rnd').value)||1);save();send({t:'go',n:st.round});play()};
}
function onData(m){
  if(m.t==='go'){st.round=m.n;save();play()}
  else if(m.t==='st'&&phase==='game'){S=m.s;draw()}
  else if(m.t==='round'){st.round=m.n;save();if(m.ph==='game'&&m.s){play();S=m.s;draw()}else if(phase!=='setup')lobby()}

  const rs=()=>{const w=box.clientWidth,h=box.clientHeight;if(!w)return;R.setSize(w,h);cam.aspect=w/h;D=w<h?18:13;cam.updateProjectionMatrix()};
  new ResizeObserver(rs).observe(box);rs();loop();
}
setup();
}</script></body></html>
